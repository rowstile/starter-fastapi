[project]
name = "rowstile-starter-fastapi"
version = "0.0.0"
description = "A FastAPI app with documents shared between people and teams, its permissions enforced by Postgres through rowstile"
requires-python = ">=3.11"
dependencies = [
  # only alphas are published so far: `>=0.1.0a6` lets uv take rowstile's pre-release, and no other package's
  "rowstile[fastapi,sqlalchemy,asyncpg,psycopg]>=0.1.0a6",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "psycopg[binary]>=3.1",
  "alembic>=1.13",
  "fastapi>=0.110",
  "uvicorn>=0.30",
]

[dependency-groups]
dev = ["httpx>=0.27", "pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
